<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#F8E7CE"/>

<!-- "only light" is doing real work here, and plain "light" was not enough.
     Android Chrome has an auto-dark feature that force-darkens any page it
     thinks doesn't handle dark mode itself. On this app that inverted every
     near-black — which turned Ottis's coat white and made him look albino.
     The "only" keyword is the documented way for a deliberately light page
     to tell Chrome to keep its hands off.

     This meta tag has to be here as well as in the stylesheet, because it
     applies before the CSS has loaded — otherwise there is a flash where
     Chrome inverts the first paint. -->
<meta name="color-scheme" content="only light"/>
<meta name="robots" content="noindex, nofollow"/>

<!-- Makes it open full-screen with no browser bars once it's on the
     home screen. The apple- ones are what iPhone actually reads. -->
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Ada's Road"/>

<title>Ada's Road</title>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="icon" href="icons/icon-192.png"/>
<link rel="apple-touch-icon" href="icons/icon-180.png"/>
<link rel="stylesheet" href="css/app.css?v=DEV"/>
</head>
<body>

<div class="banner" id="banner" hidden>

</div>

<main id="view"></main>

<nav id="nav"></nav>

<script type="module" src="js/app.js?v=DEV"></script>
</body>
</html>
